    <text x="80" y="70" text-anchor="middle" fill="#10251f" font-family="monospace" font-size="15" letter-spacing="4">HOLD NEAR</text>
    <text x="80" y="108" text-anchor="middle" fill="#10251f" font-family="monospace" font-size="31" font-weight="700">NFC</text>
    <path d="M50 150 C75 128 85 97 89 48" fill="none" stroke="#cde46e" stroke-width="2" stroke-dasharray="6 7" opacity=".6"/>
  </g>
  <rect width="1200" height="900" fill="url(#grain)"/>
  <text x="86" y="844" fill="#fffaf0" opacity=".65" font-family="monospace" font-size="18" letter-spacing="4">PRINTED PACKAGE × DIGITAL COLLECTION</text>
