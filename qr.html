<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f0e4">
  <title>二维码备用入口 · 触碰风味</title>
  <style>
    :root {
      --ink: #10251f;
      --paper: #f6f0e4;
      --cream: #fffaf0;
      --orange: #ff6d3a;
      --lime: #cde46e;
      --muted: #62726c;
      --line: rgba(16, 37, 31, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 5%, rgba(255, 109, 58, 0.3), transparent 20rem),
        var(--paper);
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    .sheet {
      width: min(100%, 600px);
      margin: 0 auto;
      overflow: hidden;
      border-radius: 28px;
      background: var(--cream);
      box-shadow: 0 24px 70px rgba(25, 41, 34, 0.14);
    }

    header {
      padding: 25px 25px 22px;
      color: var(--cream);
      background: var(--ink);
    }

    .brand {
      color: var(--lime);
      font-family: monospace;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
    }

    h1 {
      margin: 13px 0 8px;
      font-family: "STSong", "Songti SC", Georgia, serif;
      font-size: 2rem;
      font-weight: 600;
    }

    header p {
      margin: 0;
      color: rgba(255, 250, 240, 0.68);
      font-size: 0.82rem;
      line-height: 1.65;
    }

    .content {
      padding: 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.78rem;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 11px 13px;
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 12px;
      background: white;
      font: 0.78rem/1.5 monospace;
    }

    .hint {
      margin: 8px 0 20px;
      color: var(--muted);
      font-size: 0.7rem;
      line-height: 1.6;
    }

    .qr-card {
      padding: 19px;
      text-align: center;
      border: 1px dashed rgba(16, 37, 31, 0.3);
      border-radius: 20px;
      background: white;
    }

    #qrcode {
      display: grid;
      place-items: center;
      min-height: 260px;
      padding: 10px;
    }

    #qrcode img,
    #qrcode canvas {
      width: min(100%, 320px) !important;
      height: auto !important;
      image-rendering: pixelated;
    }

    .scan-title {
      margin: 8px 0 3px;
      font-family: "STSong", "Songti SC", Georgia, serif;
      font-size: 1.35rem;
    }

    .scan-subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.72rem;
    }

    .actions {
      display: flex;
      gap: 9px;
      margin-top: 17px;
    }

    button {
      flex: 1;
      min-height: 48px;
      border-radius: 999px;
      cursor: pointer;
      font: inherit;
      font-size: 0.78rem;
    }

    .primary {
      color: var(--cream);
      border: 1px solid var(--ink);
      background: var(--ink);
    }

    .secondary {
      color: var(--ink);
      border: 1px solid var(--line);
      background: transparent;
    }

    .notice {
      margin: 17px 0 0;
      padding: 12px 14px;
      color: var(--muted);
      border-radius: 12px;
      background: rgba(205, 228, 110, 0.28);
      font-size: 0.7rem;
      line-height: 1.6;
    }

    @media print {
      body {
        padding: 0;
        background: white;
      }

      .sheet {
        width: 100%;
        border-radius: 0;
        box-shadow: none;
      }

      header {
        color: var(--ink);
        background: white;
      }

      header p,
      .brand {
        color: var(--muted);
      }

      label,
      input,
      .hint,
      .actions,
      .notice {
        display: none;
      }

      .content {
        padding: 8mm;
      }

      .qr-card {
        min-height: 0;
      }

      #qrcode img,
      #qrcode canvas {
        width: 58mm !important;
      }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <header>
      <span class="brand">TOUCH / PLAY · QR FALLBACK</span>
      <h1>扫一扫，也能进入。</h1>
      <p>为不支持 NFC、未开启 NFC 或系统没有响应的设备保留同一个内容入口。</p>
    </header>
    <div class="content">
      <label for="urlInput">目标网页地址</label>
      <input id="urlInput" type="url" inputmode="url" autocomplete="url">
      <p class="hint">确认这是已经部署到公网的 HTTPS 地址。二维码应在包装打样或展板制作前完成打印测试。</p>

      <section class="qr-card" aria-live="polite">
        <div id="qrcode"></div>
        <p class="scan-title">触碰风味</p>
        <p class="scan-subtitle">扫描二维码进入同一互动页面</p>
      </section>

      <div class="actions">
        <button class="primary" id="printButton" type="button">打印二维码</button>
        <button class="secondary" id="copyButton" type="button">复制链接</button>
      </div>

      <p class="notice">建议二维码成品边长不小于 2.5 cm，四周保留至少 4 个模块的空白区域，并实际用安卓和 iPhone 各扫描一次。</p>
    </div>
  </main>

  <script src="vendor/qrcode.min.js"></script>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const defaultTarget = new URL("index.html?type=collection&series=coffee", window.location.href).href;
      const initialTarget = params.get("url") || defaultTarget;
      const input = document.querySelector("#urlInput");
      const qrContainer = document.querySelector("#qrcode");
      const printButton = document.querySelector("#printButton");
      const copyButton = document.querySelector("#copyButton");
      let renderTimer = 0;

      function normalizedValue() {
        const value = input.value.trim();
        if (!value) return "";
        try {
          const url = new URL(value);
          return (url.protocol === "https:" || url.protocol === "http:") ? url.href : "";
        } catch {
          return "";
        }
      }

      function renderQr() {
        const target = normalizedValue();
        qrContainer.innerHTML = "";
        if (!target) {
          qrContainer.textContent = "请输入有效的网页地址";
          return;
        }
        new QRCode(qrContainer, {
          text: target,
          width: 320,
          height: 320,
          colorDark: "#10251f",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.H
        });
      }

      input.value = initialTarget;
      renderQr();
      input.addEventListener("input", () => {
        window.clearTimeout(renderTimer);
        renderTimer = window.setTimeout(renderQr, 180);
      });
      printButton.addEventListener("click", () => {
        renderQr();
        window.print();
      });
      copyButton.addEventListener("click", async () => {
        const target = normalizedValue();
        if (!target) return;
        try {
          await navigator.clipboard.writeText(target);
          copyButton.textContent = "已复制";
          window.setTimeout(() => { copyButton.textContent = "复制链接"; }, 1400);
        } catch {
          input.select();
          document.execCommand("copy");
        }
      });
    })();
  </script>
</body>
</html>
